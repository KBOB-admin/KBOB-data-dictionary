name: Validate Data Dictionary

on:
  push:
    branches:
      - main
    paths:
      - 'templates/**/*.xlsx'
      - 'scripts/validator/validate_strukturvorlage.py'
      - 'scripts/validator/build_ifc_object_type_pairs.py'
      - 'scripts/validator/run_github_validation.py'
      - 'scripts/validator/readers/**/*.py'
      - 'resources/**'
      - 'tests/**'
      - '.github/workflows/validate-data-dictionary.yml'
  pull_request:
    paths:
      - 'templates/**/*.xlsx'
      - 'scripts/validator/validate_strukturvorlage.py'
      - 'scripts/validator/build_ifc_object_type_pairs.py'
      - 'scripts/validator/run_github_validation.py'
      - 'scripts/validator/readers/**/*.py'
      - 'resources/**'
      - 'tests/**'
      - '.github/workflows/validate-data-dictionary.yml'
  workflow_dispatch:
    inputs:
      workbook_path:
        description: 'Relativer Pfad zur zu validierenden .xlsx-Datei'
        required: false
        default: 'templates/test_files/Strukturvorlage_AreaMgmt_v0.6.0.xlsx'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl rdflib

      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v

      - name: Determine workbook path
        id: workbook
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.workbook_path }}" ]; then
            echo "path=${{ github.event.inputs.workbook_path }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=templates/test_files/Strukturvorlage_AreaMgmt_v0.6.0.xlsx" >> "$GITHUB_OUTPUT"
          fi

      - name: Run validation wrapper
        run: |
          python scripts/validator/run_github_validation.py \
            --workspace . \
            --workbook-path "${{ steps.workbook.outputs.path }}"

      - name: Publish validation summary in GitHub Actions
        shell: bash
        run: |
          echo "# Validation report" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          printf 'Validated workbook: `%s`\n\n' "${{ steps.workbook.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"
          cat Validation_output/github_validation_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            Validation_output/github_validation_report.json
            Validation_output/github_validation_report.md
            Validation_output/github_validation_summary.json
            Validation_output/*.xlsx
